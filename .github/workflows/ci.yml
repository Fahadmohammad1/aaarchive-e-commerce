name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Disposable database for the migration check only (never Supabase).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaarchive_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Also builds packages/shared and generates the Prisma client (postinstall).
      - run: bun install --frozen-lockfile

      # Known-vulnerable dependencies fail the build (docs/rules.md §8.9).
      # Ignored advisories are listed, with reasons, in rules.md §8.10.
      - name: Dependency audit
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # Prisma: migrations apply cleanly and describe exactly what schema.prisma says.
      - name: Migrations apply and match the schema
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aaarchive_ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aaarchive_ci
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # Auth/security e2e tests run against the migrated disposable database.
      - name: API e2e (real database)
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aaarchive_ci
        run: bun run test:e2e


  browser-e2e:
    name: Checkout in a browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaarchive_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aaarchive_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aaarchive_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aaarchive_e2e
      # Next reads the API address for its /api/v1 rewrite at build time.
      API_PROXY_TARGET: http://localhost:4100/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Database with reference data and the test product
        working-directory: apps/api
        run: |
          bunx prisma migrate deploy
          bunx prisma db seed
          bun run test/fixtures/storefront-fixture.ts
      - run: bun run --filter @aaarchive/api build
      - run: bun run --filter @aaarchive/web build
      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Checkout flow
        working-directory: apps/web
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
